<!DOCTYPE html>
<html>

<head>
    <title>Joke Generator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 50px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>😂 Random Joke Generator</h1>

    <button id="btn">
        Get Joke
    </button>

    <h2 id="setup"></h2>

    <p id="punchline"></p>

    <script>

        const button =
            document.getElementById("btn");

        button.addEventListener("click",
            async function () {

                const response = await fetch(
                    "https://official-joke-api.appspot.com/random_joke"
                );

                const data =
                    await response.json();

                document.getElementById("setup")
                    .textContent = data.setup;

                document.getElementById("punchline")
                    .textContent = data.punchline;

            });

    </script>

</body>

</html>
