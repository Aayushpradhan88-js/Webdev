<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bank Account Project</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container{
      background: white;
      width: 350px;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    input{
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    button{
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      color: white;
    }

    .deposit{
      background: #28a745;
    }

    .withdraw{
      background: #dc3545;
    }

    .balance-btn{
      background: #007bff;
    }

    .output{
      margin-top: 20px;
      background: #f1f1f1;
      padding: 15px;
      border-radius: 5px;
      min-height: 60px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Bank Account</h1>

    <input type="number" id="amount" placeholder="Enter Amount">

    <button class="deposit" onclick="depositMoney()">
      Deposit
    </button>

    <button class="withdraw" onclick="withdrawMoney()">
      Withdraw
    </button>

    <button class="balance-btn" onclick="showBalance()">
      Check Balance
    </button>

    <div class="output" id="output">
      Welcome to the bank.
    </div>
  </div>

  <script>

    // BankAccount class
    class BankAccount {

      // constructor runs automatically
      constructor(owner, balance){
        this.owner = owner;
        this.balance = balance;
      }

      // deposit method
      deposit(amount){

        // add amount to balance
        this.balance += amount;

        return `Rs ${amount} deposited successfully`;
      }

      // withdraw method
      withdraw(amount){

        // checking if balance is enough
        if(amount > this.balance){
          return "Insufficient Balance";
        }

        // subtract money
        this.balance -= amount;

        return `Rs ${amount} withdrawn successfully`;
      }

      // method to show balance
      getBalance(){
        return `Current Balance: Rs ${this.balance}`;
      }
    }


    // Creating object from class
    const myAccount = new BankAccount("Aayush", 1000);

    const output = document.getElementById("output");


    // Deposit function
    function depositMoney(){

      const amount = Number(document.getElementById("amount").value);

      // validation
      if(amount <= 0){
        output.innerHTML = "Please enter valid amount";
        return;
      }

      const message = myAccount.deposit(amount);

      output.innerHTML = `
        <p>${message}</p>
        <p>${myAccount.getBalance()}</p>
      `;
    }


    // Withdraw function
    function withdrawMoney(){

      const amount = Number(document.getElementById("amount").value);

      // validation
      if(amount <= 0){
        output.innerHTML = "Please enter valid amount";
        return;
      }

      const message = myAccount.withdraw(amount);

      output.innerHTML = `
        <p>${message}</p>
        <p>${myAccount.getBalance()}</p>
      `;
    }


    // Show balance function
    function showBalance(){

      output.innerHTML = `
        <p>${myAccount.getBalance()}</p>
      `;
    }

  </script>

</body>
</html>
